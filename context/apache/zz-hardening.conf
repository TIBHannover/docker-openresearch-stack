# Hardening of the files Apache serves directly from the web root.
#
# Everything that exists on disk is denied by default; only the MediaWiki
# entry points and static assets are allowed explicitly. Requests for
# non-existing files (wiki page URLs) are not affected and are rewritten to
# index.php by the short-url configuration of the base image.
#
# The optional "wiki-<prefix>/" path segment covers the symlink created by
# deployments that serve the wiki below a path prefix.
#
# WIKI_PUBLIC_FILES=true (public wikis only) additionally serves uploads
# directly from /images and enables thumb.php. Without it, uploads are only
# available via img_auth.php (see LocalSettings.Settings.php).

ServerTokens Prod
ServerSignature Off

PassEnv WIKI_PUBLIC_FILES

<Directory /var/www/html>
	# 1. deny every existing file
	<If "-f %{REQUEST_FILENAME}">
		Require all denied
	</If>

	# 2. allow MediaWiki entry points
	<If "-f %{REQUEST_FILENAME} && %{REQUEST_FILENAME} =~ m#^/var/www/html/(wiki-[^/]+/)?(index|api|load|rest|img_auth|opensearch_desc)\.php$#">
		Require all granted
	</If>

	# 3. allow static assets of core, skins and extensions
	<If "-f %{REQUEST_FILENAME} && %{REQUEST_FILENAME} =~ m#^/var/www/html/(wiki-[^/]+/)?(resources|skins|extensions)/.+\.(js|css|png|gif|jpe?g|svg|webp|ico|woff2?|ttf|eot|otf)$# && %{REQUEST_FILENAME} !~ m#/(tests?|node_modules)/#">
		Require all granted
	</If>

	# 4. public wikis: direct file access and thumbnail endpoints
	<If "-f %{REQUEST_FILENAME} && env('WIKI_PUBLIC_FILES') == 'true' && %{REQUEST_FILENAME} =~ m#^/var/www/html/(wiki-[^/]+/)?(thumb|thumb_handler)\.php$#">
		Require all granted
	</If>
	<If "-f %{REQUEST_FILENAME} && env('WIKI_PUBLIC_FILES') == 'true' && %{REQUEST_FILENAME} =~ m#^/var/www/html/(wiki-[^/]+/)?images/(.+/)?[^./][^/]*$#">
		Require all granted
	</If>
</Directory>
