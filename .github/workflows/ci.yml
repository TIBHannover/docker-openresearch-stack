name: CI

on:
  pull_request:
  push:
    branches:
      - '1.39'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  ci:

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint, build and test
        run: make ci

      - name: Clean up CI environment
        run: make ci-cleanup
        if: always()
